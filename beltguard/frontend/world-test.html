<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>world3d test (S9, temporary)</title>
<style>
html,body{margin:0;height:100%;background:#1b1d21;font:12px/1.45 ui-monospace,Consolas,monospace;color:#eee;overflow:hidden}
#stage{position:absolute;inset:0}
#hud{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);padding:6px 9px;border-radius:6px;white-space:pre;z-index:9;pointer-events:none}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="hud">loading…</div>
<script type="module">
// S9 temporary harness for world3d.js (delete when done).
//   ?mode=solo (default): S7-like renderer/lights + a mock site, camera presets via ?view=rest|low|north|aerial|plant|east|west
//   ?mode=s7: real model3d.js createModel() + buildWorld() on its scene (what the integration will look like)
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'solo';
const view = q.get('view') || 'rest';
const hud = document.getElementById('hud');
const stage = document.getElementById('stage');
const v = Date.now();
const { buildWorld } = await import(`./world3d.js?v=${v}`);
let renderer, scene, camera, controls = null, world;
const center = new THREE.Vector3(0, 0, -1.5);

function presetCamera(cam, aspect) {
  const T = new THREE.Vector3(1.3, 0.55, 0.85);
  const set = (az, el, R, t = T) => cam.position.set(t.x + R * Math.sin(az) * Math.cos(el), t.y + R * Math.sin(el), t.z + R * Math.cos(az) * Math.cos(el));
  let target = T;
  if (view === 'rest') { const w = Math.min(1, Math.max(0, (1.8 - aspect) / 0.7)); set(0.6 + 0.32 * w, 0.5 + 0.12 * w, Math.min(36, Math.max(16, (31.5 - 6.5 * w) / aspect))); }
  else if (view === 'low') { target = new THREE.Vector3(0, 3, -1.5); set(0.75, 0.1, 46, target); }
  else if (view === 'north') { target = new THREE.Vector3(-60, 8, -60); cam.position.set(30, 14, 30); }
  else if (view === 'aerial') { target = new THREE.Vector3(-60, 0, -150); cam.position.set(320, 330, 420); }
  else if (view === 'plant') { target = new THREE.Vector3(300, 20, -300); cam.position.set(60, 30, 40); }
  else if (view === 'east') { target = new THREE.Vector3(80, 6, -20); cam.position.set(-10, 12, 30); }
  else if (view === 'west') { target = new THREE.Vector3(-120, 4, 30); cam.position.set(20, 12, 20); }
  else if (view === 'road') { target = new THREE.Vector3(0, 2, -40); cam.position.set(30, 7, 8); }
  cam.lookAt(target);
  return target;
}

if (mode === 's7') {
  const { createModel } = await import(`./model3d.js?v=${v}`);
  createModel(stage, {});
  ({ renderer, scene, camera } = stage.__bg3d);
  world = buildWorld({ THREE, scene, renderer, camera, siteRadius: 26, center });
  let last = performance.now();
  (function loop() { requestAnimationFrame(loop); const now = performance.now(); world.update(Math.min(0.05, (now - last) / 1000), now / 1000); last = now; })();
} else {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  Object.assign(renderer.domElement.style, { position: 'absolute', inset: '0', width: '100%', height: '100%' });
  stage.appendChild(renderer.domElement);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf6f7f9);
  scene.fog = new THREE.Fog(0xffffff, 40, 150);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 300);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xdfe3e8, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(0.8 - 13, 24, 11); sun.target.position.set(0.8, 0, 0); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 90 });
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
  scene.add(sun, sun.target);
  // legacy-looking objects so the auto-hide path is exercised
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(280, 280), new THREE.MeshStandardMaterial({ color: 0xbbbbbb })).rotateX(-Math.PI / 2));
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(170, 16, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.BackSide })));
  // mock site: pad, conveyor, sheds, fence posts, a yellow truck
  const std = (c, r = 0.6, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
  const add = (geo, mat, x, y, z) => { const o = new THREE.Mesh(geo, mat); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; scene.add(o); return o; };
  add(new THREE.BoxGeometry(16.6, 0.06, 7.4), std(0xeceef1, 0.9), -1.35, -0.0, 0);
  add(new THREE.BoxGeometry(12, 0.5, 1.6), std(0x2a2d31, 0.8), 0, 1.2, 0);
  for (let x = -6; x <= 6; x += 1.5) add(new THREE.BoxGeometry(0.08, 1.2, 1.7), std(0xdfe3e8, 0.4, 0.4), x, 0.6, 0);
  add(new THREE.BoxGeometry(6, 4, 5), std(0xffffff, 0.5, 0.3), -11, 2, -8);
  add(new THREE.BoxGeometry(6, 2.6, 2.4), std(0xffffff, 0.5, 0.3), 9, 1.3, -8);
  add(new THREE.BoxGeometry(3.7, 3, 6), std(0xf2c230, 0.55), -15.2, 1.5, -6.8);
  add(new THREE.ConeGeometry(2.4, 1.6, 20), std(0x4a4f55, 0.95), 8.1, 0.8, 0);
  for (const [ax, az, bx, bz] of [[-21, -14, 21, -14], [21, -14, 21, 11], [21, 11, -21, 11], [-21, 11, -21, -14]]) {
    const n = Math.round(Math.hypot(bx - ax, bz - az) / 3.5);
    for (let i = 0; i <= n; i += 1) add(new THREE.CylinderGeometry(0.045, 0.045, 2.1, 6), std(0xb4bac2, 0.45, 0.4), ax + (bx - ax) * i / n, 1.05, az + (bz - az) * i / n);
  }
  const tw = performance.now();
  world = buildWorld({ THREE, scene, renderer, camera, siteRadius: 26, center });
  console.log('[world-test] buildWorld ms', Math.round(performance.now() - tw), world.info);
  const target = presetCamera(camera, innerWidth / innerHeight);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(target);
  controls.enableDamping = true;
  controls.update();
  addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
  const clock = new THREE.Clock();
  let t = 0;
  (function loop() { requestAnimationFrame(loop); const dt = Math.min(0.05, clock.getDelta()); t += dt; world.update(dt, t); controls.update(); renderer.render(scene, camera); })();
}

function bench(n = 30) {
  const gl = renderer.getContext();
  const run = () => { gl.finish(); const t0 = performance.now(); for (let i = 0; i < n; i += 1) { world.update(1 / 60); renderer.render(scene, camera); } gl.finish(); return (performance.now() - t0) / n; };
  run();
  const a = Math.min(run(), run());
  const calls = renderer.info.render.calls, tris = renderer.info.render.triangles;
  world.group.visible = false;
  const b = Math.min(run(), run());
  world.group.visible = true;
  const u0 = performance.now();
  for (let i = 0; i < 300; i += 1) world.update(1 / 60);
  const upd = (performance.now() - u0) / 300;
  return { msWithWorld: +a.toFixed(2), msWithout: +b.toFixed(2), worldMs: +(a - b).toFixed(2), updateMs: +upd.toFixed(3), calls, tris };
}
window.__wt = { THREE, renderer, scene, camera, world, bench, controls };
setTimeout(() => {
  const b = bench();
  console.log('[world-test] bench', JSON.stringify(b));
  hud.textContent = `world3d · mode ${mode} · view ${view}\nbuild ${world.info.buildMs} ms · hidden legacy ${world.info.hiddenLegacy.length}\nframe ${b.msWithWorld} ms (world +${b.worldMs} ms, update ${b.updateMs} ms)\n${b.calls} calls · ${(b.tris / 1000).toFixed(0)}k tris`;
}, 2500);
</script>
</body>
</html>
